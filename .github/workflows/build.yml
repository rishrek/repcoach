name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build everything
        run: ./gradlew :core:test :pose-bridge:test :tv:testDebugUnitTest :phone:assembleDebug :tv:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            phone/build/outputs/apk/debug/*.apk
            tv/build/outputs/apk/debug/*.apk

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lambda tests
        run: python -m unittest discover -s backend -v
